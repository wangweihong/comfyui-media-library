<!doctype html><html><head><meta charset="utf-8"><title>ComfyUI renderer bridge fixture</title></head><body style="margin:20px;background:#282c34;color:white;font:14px sans-serif"><h1>Node renderer integration fixture</h1><div id="nodes" style="display:flex;gap:30px"></div><script type="module">
const nativeTypes=new Set(['button','BUTTON','text','string','STRING','customtext','textarea','multiline','number','slider','combo','toggle','boolean','image','galleria','markdown','color']);
class Node {
 constructor(){this.widgets=[{name:'file_path',value:''},{name:'asset_id',value:''}];this.element=document.createElement('section');this.element.style.cssText='width:390px;min-height:420px;border:1px solid #68758b;padding:10px';this.id=window.nodes.length+1;this.element.dataset.node=String(this.id);this.label=document.createElement('p');this.label.textContent='Node '+this.id;this.element.append(this.label);document.getElementById('nodes').append(this.element);}
 addDOMWidget(name,type,element,options){if(nativeTypes.has(type))throw Error('Native widget collision');const wrapper=document.createElement('div');wrapper.style.cssText='width:100%;height:'+options.getMinHeight()+'px';wrapper.dataset.widget=name;wrapper.append(element);this.element.append(wrapper);return{name,type,element,options};}
 setSize(){}setDirtyCanvas(){this.element.dataset.path=this.widgets[0].value;this.element.dataset.asset=this.widgets[1].value;}
}
window.nodes=[];window.mockApp={registerExtension:async ext=>{await ext.beforeRegisterNodeDef(Node,{name:'MediaLibraryPath'});window.createNode=values=>{const node=new Node();window.nodes.push(node);node.onNodeCreated();if(values){node.widgets[0].value=values[0];node.widgets[1].value=values[1];node.onConfigure();}return node;};createNode();createNode();window.ready=true;},graph:{change(){window.changes=(window.changes||0)+1;}}};
await import('/extensions/media_library/media_library.js');
</script></body></html>
